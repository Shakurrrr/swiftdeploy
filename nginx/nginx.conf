# Generated by swiftdeploy — DO NOT EDIT MANUALLY
# Source of truth: manifest.yaml

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Access log format ─────────────────────────────────────────────────────
    log_format swiftdeploy_fmt '$time_iso8601 | $status | ${request_time}s | $upstream_addr | $request';
    access_log /var/log/nginx/access.log swiftdeploy_fmt;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json text/plain;

    # ── Upstream ──────────────────────────────────────────────────────────────
    upstream swiftdeploy_backend {
        server swiftdeploy-service:3000;
        keepalive 32;
    }

    # ── Custom JSON error pages ───────────────────────────────────────────────
    map $status $error_body_502 {
        default '{"error":"Bad Gateway","code":502,"service":"swiftdeploy-service","contact":"ops@swiftdeploy.local"}';
    }
    map $status $error_body_503 {
        default '{"error":"Service Unavailable","code":503,"service":"swiftdeploy-service","contact":"ops@swiftdeploy.local"}';
    }
    map $status $error_body_504 {
        default '{"error":"Gateway Timeout","code":504,"service":"swiftdeploy-service","contact":"ops@swiftdeploy.local"}';
    }

    server {
        listen 8080;
        server_name _;

        # ── Timeouts ─────────────────────────────────────────────────────────
        proxy_connect_timeout 30s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
        send_timeout          30s;

        # ── Security headers ─────────────────────────────────────────────────
        add_header X-Deployed-By "swiftdeploy" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        server_tokens off;

        # ── Proxy location ───────────────────────────────────────────────────
        location / {
            proxy_pass         http://swiftdeploy_backend;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Forward X-Mode from upstream response to client
            proxy_pass_header  X-Mode;

            # ── JSON error bodies ─────────────────────────────────────────
            error_page 502 = @error502;
            error_page 503 = @error503;
            error_page 504 = @error504;
        }

        location @error502 {
            internal;
            add_header Content-Type application/json always;
            add_header X-Deployed-By "swiftdeploy" always;
            return 502 '{"error":"Bad Gateway","code":502,"service":"swiftdeploy-service","contact":"ops@swiftdeploy.local"}';
        }

        location @error503 {
            internal;
            add_header Content-Type application/json always;
            add_header X-Deployed-By "swiftdeploy" always;
            return 503 '{"error":"Service Unavailable","code":503,"service":"swiftdeploy-service","contact":"ops@swiftdeploy.local"}';
        }

        location @error504 {
            internal;
            add_header Content-Type application/json always;
            add_header X-Deployed-By "swiftdeploy" always;
            return 504 '{"error":"Gateway Timeout","code":504,"service":"swiftdeploy-service","contact":"ops@swiftdeploy.local"}';
        }

        # ── Health endpoint passthrough ───────────────────────────────────────
        location /healthz {
            proxy_pass         http://swiftdeploy_backend/healthz;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            access_log         off;
        }
    }
}
